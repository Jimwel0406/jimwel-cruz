<style>
body {
  background: linear-gradient(135deg, #f2c994 0%, #b3e5fc 50%, #81d4fa 100%);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.game-tile {
  box-shadow: inset 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  user-select: none;
}
.game-tile:active { transform: scale(0.92); }

.mole-active {
  animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes popUp {
  0% { transform: translateY(100%) scale(0.5); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

.mole-hidden {
  animation: popDown 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes popDown {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(100%) scale(0.5); opacity: 0; }
}

.glass-panel {
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.btn-3d {
  box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.2);
  transition: all 0.1s ease;
}
.btn-3d:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.2);
}

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.fill-icon { font-variation-settings: 'FILL' 1; }

.splatter {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 100;
  animation: splat 0.6s ease-out forwards;
}
@keyframes splat {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
}

.score-popup {
  position: fixed;
  pointer-events: none;
  z-index: 99;
  font-weight: 800;
  animation: floatUp 0.8s ease-out forwards;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(0.5); opacity: 1; }
  100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
}

.combo-indicator {
  animation: comboPulse 0.3s ease-out;
}
@keyframes comboPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.shake {
  animation: shake 0.3s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

.modal-overlay {
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

@keyframes slideUp {

  to { transform: translateY(0); opacity: 1; }
}

.tile-hit {

.mole-timer-fill {

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, duration, type = 'sine', vol = 0.15) {
  if (!soundEnabled) return;
  try {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playHit() { playTone(800, 0.1, 'square', 0.1); }
function playGolden() {
  playTone(1000, 0.08, 'sine', 0.12);
  setTimeout(() => playTone(1400, 0.12, 'sine', 0.12), 80);
}
function playMiss() { playTone(300, 0.2, 'sawtooth', 0.08); }
function playGameOver() {
  playTone(600, 0.15, 'sine', 0.1);
  setTimeout(() => playTone(400, 0.2, 'sine', 0.1), 150);
  setTimeout(() => playTone(200, 0.3, 'sine', 0.1), 350);
}
function playCombo() { playTone(1000, 0.06, 'sine', 0.1); }

const GRID_SIZE = 9;

const state = {
  score: 0,
  highScore: parseInt(localStorage.getItem('moleBashHigh') || '0'),
  lives: 3,
  maxLives: 3,
  timeLeft: 30,
  totalTime: 30,
  speed: 1,
  combo: 0,
  maxCombo: 0,
  molesHit: 0,
  molesMissed: 0,
  isPlaying: false,
  currentMoleIndex: -1,
  moleTimer: null,
  gameTimer: null,
  moleTimeout: null,
  spawnTimeout: null,
  goldenMole: false,
};

const MOLE_TIMES = [750, 550, 400];
const SPAWN_INTERVALS = [650, 500, 350];
const BASE_POINTS = 10;
const GOLDEN_MULTIPLIER = 4;

const tiles = [];
const gridEl = document.getElementById('gameGrid');
const scoreDisplay = document.getElementById('scoreDisplay');
const timeDisplay = document.getElementById('timeDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const startBtn = document.getElementById('startBtn');
const bottomNav = document.querySelector('nav.fixed.bottom-0');
const comboDisplay = document.getElementById('comboDisplay');
const gameOverModal = document.getElementById('gameOverModal');
const finalScore = document.getElementById('finalScore');
const finalCombo = document.getElementById('finalCombo');
const finalHigh = document.getElementById('finalHigh');
const playAgainBtn = document.getElementById('playAgainBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
const soundBtn = document.getElementById('soundBtn');

highScoreDisplay.textContent = state.highScore;

function createGrid() {
  gridEl.innerHTML = '';
  for (let i = 0; i < GRID_SIZE; i++) {
    const tile = document.createElement('div');
    tile.className = 'relative overflow-hidden bg-primary-container rounded-xl sm:rounded-2xl game-tile flex items-center justify-center cursor-pointer';
    tile.dataset.index = i;
    tile.innerHTML = `<span class="material-symbols-outlined text-4xl sm:text-7xl text-on-primary-container/20 pointer-events-none relative z-[2]">pest_control</span><div class="mole-timer-fill rounded-xl sm:rounded-2xl"></div>`;
    const moleDiv = document.createElement('div');
    moleDiv.className = 'mole-container absolute inset-0 flex items-center justify-center pointer-events-none hidden z-[3]';
    moleDiv.innerHTML = `<div class="mole-body w-full h-full flex items-center justify-center rounded-xl sm:rounded-2xl shadow-xl"><span class="material-symbols-outlined text-4xl sm:text-7xl fill-icon">smart_toy</span></div>`;
    tile.appendChild(moleDiv);
    tile.addEventListener('click', () => handleTileClick(i));
    tile.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleTileClick(i);
    }, { passive: false });
    gridEl.appendChild(tile);
    tiles.push(tile);
  }
}

function updateLives() {
  livesDisplay.innerHTML = '';
  for (let i = 0; i < state.maxLives; i++) {
    const heart = document.createElement('span');
    heart.className = `material-symbols-outlined ${i < state.lives ? 'text-error fill-icon' : 'text-error/30'}`;
    heart.textContent = 'favorite';
    livesDisplay.appendChild(heart);
  }
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function updateUI() {
  scoreDisplay.textContent = state.score.toLocaleString();
  timeDisplay.textContent = formatTime(state.timeLeft);
  updateLives();
  if (state.combo > 1) {
    comboDisplay.textContent = `x${state.combo}`;
    comboDisplay.classList.remove('hidden');
    comboDisplay.classList.add('combo-indicator');
    setTimeout(() => comboDisplay.classList.remove('combo-indicator'), 300);
  } else {
    comboDisplay.classList.add('hidden');
  }
}

function showMole(index, golden = false) {
  hideMole();
  if (index < 0 || index >= GRID_SIZE) return;
  const tile = tiles[index];
  const container = tile.querySelector('.mole-container');
  const body = container.querySelector('.mole-body');
  
  if (golden) {
    body.className = 'mole-body w-full h-full flex items-center justify-center rounded-xl sm:rounded-2xl shadow-xl bg-gold border-b-4 border-gold';
    body.innerHTML = `<span class="material-symbols-outlined text-4xl sm:text-7xl fill-icon text-white">stars</span>`;
  } else {
    body.className = 'mole-body w-full h-full flex items-center justify-center rounded-xl sm:rounded-2xl shadow-xl bg-tertiary border-b-4 border-tertiary-container';
    body.innerHTML = `<span class="material-symbols-outlined text-4xl sm:text-7xl fill-icon text-on-tertiary">smart_toy</span>`;
  }
  
  container.classList.remove('hidden');
  body.classList.remove('mole-hidden');
  body.classList.add('mole-active');
  state.currentMoleIndex = index;
  state.goldenMole = golden;
  
  const fill = tile.querySelector('.mole-timer-fill');
  if (fill) {
    fill.style.transition = 'none';
    fill.style.height = '0%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        fill.style.transition = `height ${MOLE_TIMES[state.speed - 1]}ms linear`;
        fill.style.height = '100%';
      });
    });
  }
  
  if (state.moleTimeout) clearTimeout(state.moleTimeout);
  state.moleTimeout = setTimeout(() => {
    if (state.currentMoleIndex === index && state.isPlaying) {
      missMole();
    }
  }, MOLE_TIMES[state.speed - 1]);
}

function hideMole() {
  if (state.currentMoleIndex === -1) return;
  const tile = tiles[state.currentMoleIndex];
  if (tile) {
    const container = tile.querySelector('.mole-container');
    const body = container?.querySelector('.mole-body');
    if (body) {
      body.classList.remove('mole-active');
      body.classList.add('mole-hidden');
    }
    if (container) {
      setTimeout(() => { container.classList.add('hidden'); }, 200);
    }
    const fill = tile.querySelector('.mole-timer-fill');
    if (fill) {
      fill.style.transition = 'none';
      fill.style.height = '0%';
    }
  }
  state.currentMoleIndex = -1;
  state.goldenMole = false;
  if (state.moleTimeout) {
    clearTimeout(state.moleTimeout);
    state.moleTimeout = null;
  }
}

function missMole() {
  if (!state.isPlaying) return;
  const missedIndex = state.currentMoleIndex;
  state.molesMissed++;
  state.combo = 0;
  state.lives--;
  playMiss();
  updateUI();
  
  if (missedIndex >= 0) {
    const tile = tiles[missedIndex];
    const fill = tile.querySelector('.mole-timer-fill');
    if (fill) {
      fill.style.transition = 'none';
      fill.style.height = '0%';
    }
    const container = tile.querySelector('.mole-container');
    if (container) {
      const body = container.querySelector('.mole-body');
      if (body) {
        body.className = 'mole-body w-full h-full flex items-center justify-center rounded-xl sm:rounded-2xl bg-error/20';
        body.innerHTML = '<span class="material-symbols-outlined text-4xl sm:text-7xl fill-icon text-error">heart_broken</span>';
        body.classList.remove('mole-hidden');
        body.classList.add('mole-active');
      }
      setTimeout(() => { container.classList.add('hidden'); }, 500);
    }
  }
  
  state.currentMoleIndex = -1;
  state.goldenMole = false;
  
  if (state.lives <= 0) {
    endGame();
    return;
  }
  
  scheduleNextMole();
}

function spawnMole() {
  if (!state.isPlaying) return;
  hideMole();
  
  const available = [];
  for (let i = 0; i < GRID_SIZE; i++) {
    if (i !== state.currentMoleIndex) available.push(i);
  }
  
  if (available.length === 0) return;
  const idx = available[Math.floor(Math.random() * available.length)];
  const golden = Math.random() < 0.15;
  showMole(idx, golden);
}

function scheduleNextMole() {
  if (state.spawnTimeout) clearTimeout(state.spawnTimeout);
  const delay = SPAWN_INTERVALS[state.speed - 1] + Math.random() * 400;
  state.spawnTimeout = setTimeout(spawnMole, delay);
}

function handleTileClick(index) {
  if (!state.isPlaying || index !== state.currentMoleIndex) return;
  const tile = tiles[index];
  tile.classList.add('tile-hit');
  setTimeout(() => tile.classList.remove('tile-hit'), 200);
  
  if (state.goldenMole) {
    const points = BASE_POINTS * GOLDEN_MULTIPLIER * Math.max(1, state.combo);
    state.score += points;
    playGolden();
    showScorePopup(index, `+${points} ⭐`);
  } else {
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    const points = BASE_POINTS * state.combo;
    state.score += points;
    playHit();
    if (state.combo > 1) playCombo();
    showScorePopup(index, `+${points}${state.combo > 1 ? ` x${state.combo}` : ''}`);
  }
  
  state.molesHit++;
  playerStats.totalHits++;
  if (state.goldenMole) playerStats.totalGolden++;
  saveStats();
  createSplatter(tile);
  const bubbleCount = state.goldenMole ? 8 : Math.min(3 + state.combo * 1.5, 12);
  burstBubbles(Math.floor(bubbleCount));
  updateUI();
  hideMole();
  
  if (state.lives <= 0) {
    endGame();
  } else {
    scheduleNextMole();
  }
}

function showScorePopup(tileIndex, text) {
  const tile = tiles[tileIndex];
  const rect = tile.getBoundingClientRect();
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.textContent = text;
  const isGolden = text.includes('⭐');
  popup.style.cssText = `
    left: ${rect.left + rect.width / 2}px;
    top: ${rect.top}px;
    transform: translateX(-50%);
    font-size: ${isGolden ? '28' : '20'}px;
    color: ${isGolden ? '#f5a623' : '#005da7'};
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  `;
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 800);
}

function createSplatter(tile) {
  const rect = tile.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['#67f7d5', '#48ddbc', '#005da7', '#f5a623', '#bbae00'];
  const count = 8 + Math.floor(Math.random() * 5);
  
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const dist = 30 + Math.random() * 50;
    const size = 4 + Math.random() * 8;
    dot.className = 'splatter';
    dot.style.cssText = `
      left: ${cx}px; top: ${cy}px;
      width: ${size}px; height: ${size}px;
      background: ${colors[i % colors.length]};
      --dx: ${Math.cos(angle) * dist}px;
      --dy: ${Math.sin(angle) * dist}px;
    `;
    document.body.appendChild(dot);
    setTimeout(() => dot.remove(), 600);
  }
}

function startGame() {
  if (state.isPlaying) return;
  initAudio();
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  state.score = 0;
  state.lives = state.maxLives;
  state.combo = 0;
  state.maxCombo = 0;
  state.molesHit = 0;
  state.molesMissed = 0;
  state.currentMoleIndex = -1;
  state.isPlaying = true;
  state.timeLeft = state.totalTime;
  
  if (window.innerWidth < 1024) {
    bottomNav.classList.remove('nav-visible');
    bottomNav.classList.add('nav-hidden');
  }
  
  updateUI();
  startBtn.textContent = 'GET READY...';
  startBtn.disabled = true;
  gameOverModal.classList.add('hidden');
  
  document.querySelectorAll('.speed-btn, .time-btn').forEach(b => b.style.pointerEvents = 'none');
  
  setTimeout(() => {
    startBtn.textContent = 'PLAYING...';
    spawnMole();
  }, 1000);
  
  state.gameTimer = setInterval(() => {
    state.timeLeft--;
    timeDisplay.textContent = formatTime(state.timeLeft);
    if (state.timeLeft <= 10) {
      timeDisplay.classList.add('text-error');
    }
    if (state.timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function endGame() {
  state.isPlaying = false;
  clearInterval(state.gameTimer);
  clearTimeout(state.spawnTimeout);
  clearTimeout(state.moleTimeout);
  state.gameTimer = null;
  state.spawnTimeout = null;
  state.moleTimeout = null;
  
  hideMole();
  
  if (state.score > state.highScore) {
    state.highScore = state.score;
    localStorage.setItem('moleBashHigh', state.highScore.toString());
    highScoreDisplay.textContent = state.highScore;
  }
  
  playerStats.totalGames++;
  playerStats.lifetimeScore += state.score;
  if (state.maxCombo > playerStats.bestCombo) playerStats.bestCombo = state.maxCombo;
  if (state.score > playerStats.bestScore) playerStats.bestScore = state.score;
  if (state.lives === state.maxLives) playerStats.perfectGames++;
  if (!playerStats.wonSpeeds.includes(state.speed)) playerStats.wonSpeeds.push(state.speed);
  saveStats();
  checkAchievements();
  
  playGameOver();
  
  finalScore.textContent = state.score.toLocaleString();
  finalCombo.textContent = `x${state.maxCombo}`;
  finalHigh.textContent = state.highScore.toLocaleString();
  gameOverModal.classList.remove('hidden');
  
  startBtn.textContent = 'START';
  startBtn.disabled = false;
  timeDisplay.classList.remove('text-error');
  comboDisplay.classList.add('hidden');
  
  document.querySelectorAll('.speed-btn, .time-btn').forEach(b => b.style.pointerEvents = '');
  
  if (window.innerWidth < 1024) {
    bottomNav.classList.remove('nav-hidden');
    bottomNav.classList.add('nav-visible');
  }
}

function resetGame() {
  endGame();
}

function init() {
  createGrid();
  updateLives();
  timeDisplay.textContent = formatTime(state.totalTime);
  
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.isPlaying) return;
      document.querySelectorAll('.speed-btn').forEach(b => {
        b.className = 'speed-btn flex-1 py-2 sm:py-3 px-1 sm:px-2 rounded-xl border-2 border-transparent bg-white/50 text-outline font-bold hover:bg-white/80 transition-all text-xs sm:text-sm';
      });
      btn.className = 'speed-btn flex-1 py-2 sm:py-3 px-1 sm:px-2 rounded-xl border-2 border-primary bg-primary-container text-primary font-bold transition-all btn-3d text-xs sm:text-sm';
      state.speed = parseInt(btn.dataset.speed);
    });
  });
  
  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.isPlaying) return;
      document.querySelectorAll('.time-btn').forEach(b => {
        b.className = 'time-btn flex-1 py-2 sm:py-3 px-1 sm:px-1 rounded-xl border-2 border-transparent bg-white/50 text-outline font-bold hover:bg-white/80 transition-all text-xs sm:text-sm';
      });
      btn.className = 'time-btn flex-1 py-2 sm:py-3 px-1 sm:px-1 rounded-xl border-2 border-error bg-error-container text-error font-bold transition-all btn-3d text-xs sm:text-sm';
      state.totalTime = parseInt(btn.dataset.time);
      state.timeLeft = state.totalTime;
      timeDisplay.textContent = formatTime(state.timeLeft);
    });
  });
  
  startBtn.addEventListener('click', startGame);
  
  playAgainBtn.addEventListener('click', () => {
    playAgainBtn.disabled = true;
    playAgainBtn.textContent = 'Starting...';
    setTimeout(() => {
      playAgainBtn.disabled = false;
      playAgainBtn.textContent = 'Play Again';
      startGame();
    }, 600);
  });
  
  closeModalBtn.addEventListener('click', () => {
    gameOverModal.classList.add('hidden');
  });
  
  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundBtn.querySelector('span').textContent = soundEnabled ? 'volume_up' : 'volume_off';
  });
  
  document.getElementById('navTrophies').addEventListener('click', openTrophiesModal);
  document.getElementById('navProfile').addEventListener('click', openProfileDrawer);
  document.getElementById('navPlay').addEventListener('click', () => {
    if (!state.isPlaying) startGame();
  });
  document.getElementById('closeTrophiesBtn').addEventListener('click', () => {
    document.getElementById('trophiesModal').classList.add('hidden');
  });
  document.getElementById('closeProfileBtn').addEventListener('click', () => {
    document.getElementById('profileDrawerOverlay').classList.add('hidden');
  });
  
  document.getElementById('profileNameInput').addEventListener('input', (e) => {
    profile.name = e.target.value || 'Player';
    saveProfile();
  });
  
  document.getElementById('resetDataBtn').addEventListener('click', () => {
    if (confirm('Reset all progress? Achievements, stats, and high score will be lost.')) {
      localStorage.removeItem('moleBashStats');
      localStorage.removeItem('moleBashAchievements');
      localStorage.removeItem('moleBashHigh');
      playerStats = defaultStats();
      unlockedAchievements = [];
      state.highScore = 0;
      highScoreDisplay.textContent = '0';
      updateProfileUI();
    }
  });
}

let bubbleContainer;

function createBubbles() {
  bubbleContainer = document.createElement('div');
  bubbleContainer.className = 'fixed inset-0 pointer-events-none overflow-hidden z-0';
  document.body.prepend(bubbleContainer);
  const sizes = [20, 30, 40, 50, 60, 80];
  const durations = [12, 16, 20, 25, 30, 35];
  for (let i = 0; i < 12; i++) {
    addBubble(sizes, durations);
  }
}

function addBubble(sizes, durations) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const sizeList = sizes || [20, 30, 40, 50, 60, 80];
  const durList = durations || [12, 16, 20, 25, 30, 35];
  const size = sizeList[Math.floor(Math.random() * sizeList.length)];
  bubble.style.width = size + 'px';
  bubble.style.height = size + 'px';
  bubble.style.left = Math.random() * 100 + '%';
  bubble.style.animationDuration = (durList[Math.floor(Math.random() * durList.length)] + Math.random() * 10) + 's';
  bubble.style.animationDelay = Math.random() * 5 + 's';
  bubbleContainer.appendChild(bubble);
  setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, 35000);
}

function burstBubbles(count) {
  const sizes = [15, 25, 35, 45, 55];
  const durations = [8, 10, 12, 14, 16];
  for (let i = 0; i < count; i++) {
    setTimeout(() => addBubble(sizes, durations), i * 80);
  }
}

let playerStats = loadStats();
let profile = loadProfile();
let unlockedAchievements = loadAchievements();
let toastTimeout = null;

function loadStats() {
  try { return JSON.parse(localStorage.getItem('moleBashStats')) || defaultStats(); } catch { return defaultStats(); }
}
function defaultStats() {
  return { totalGames: 0, totalHits: 0, totalGolden: 0, bestScore: 0, bestCombo: 0, perfectGames: 0, wonSpeeds: [], lifetimeScore: 0 };
}
function saveStats() {
  localStorage.setItem('moleBashStats', JSON.stringify(playerStats));
}

function loadProfile() {
  try { return JSON.parse(localStorage.getItem('moleBashProfile')) || defaultProfile(); } catch { return defaultProfile(); }
}
function defaultProfile() {
  return { name: 'Player', theme: 'default' };
}
function saveProfile() {
  localStorage.setItem('moleBashProfile', JSON.stringify(profile));
}

function loadAchievements() {
  try { return JSON.parse(localStorage.getItem('moleBashAchievements')) || []; } catch { return []; }
}
function saveAchievements() {
  localStorage.setItem('moleBashAchievements', JSON.stringify(unlockedAchievements));
}

let toastQueue = [];
let showingToast = false;

function checkAchievements() {
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a => {
    if (!unlockedAchievements.includes(a.id) && a.check(playerStats)) {
      unlockedAchievements.push(a.id);
      newlyUnlocked.push(a);
    }
  });
  if (newlyUnlocked.length) {
    saveAchievements();
    toastQueue.push(...newlyUnlocked);
    if (!showingToast) showNextToast();
  }
}

function showNextToast() {
  if (!toastQueue.length) { showingToast = false; return; }
  showingToast = true;
  const achievement = toastQueue.shift();
  const toast = document.getElementById('achievementToast');
  const title = document.getElementById('toastTitle');
  const icon = document.getElementById('toastIcon');
  title.textContent = achievement.name;
  icon.textContent = achievement.icon || 'emoji_events';
  toast.classList.remove('hidden', 'achievement-toast-out');
  toast.classList.add('achievement-toast');
  playAchievementSound();
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('achievement-toast');
    toast.classList.add('achievement-toast-out');
    setTimeout(() => {
      toast.classList.add('hidden');
      showNextToast();
    }, 300);
  }, 3000);
}

function renderAchievements() {
  const list = document.getElementById('achievementsList');
  list.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = unlockedAchievements.includes(a.id);
    const card = document.createElement('div');
    card.className = `achieve-card flex items-center gap-3 p-3 rounded-xl ${unlocked ? 'bg-white/60' : 'bg-white/30 achieve-locked'}`;
    card.innerHTML = `
      <span class="material-symbols-outlined text-3xl ${unlocked ? 'text-gold fill-icon' : 'text-outline'}">${a.icon}</span>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-sm ${unlocked ? 'text-on-background' : 'text-on-surface-variant'}">${a.name}</div>
        <div class="text-xs text-on-surface-variant truncate">${a.desc}</div>
      </div>
      <span class="material-symbols-outlined ${unlocked ? 'text-secondary fill-icon' : 'text-outline'}">${unlocked ? 'check_circle' : 'lock'}</span>
    `;
    list.appendChild(card);
  });
}

function applyTheme(themeId) {
  const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
  document.documentElement.style.setProperty('--theme-primary', theme.primary);
  document.documentElement.style.setProperty('--theme-secondary', theme.secondary);
  document.body.style.background = `linear-gradient(135deg, ${theme.bg[0]} 0%, ${theme.bg[1]} 50%, ${theme.bg[2]} 100%)`;
  document.querySelectorAll('.theme-preview').forEach(el => {
    el.style.background = `linear-gradient(135deg, ${theme.bg[0]}, ${theme.bg[2]})`;
  });
  profile.theme = themeId;
  saveProfile();
}

function renderThemeSwatches() {
  const container = document.getElementById('themeSwatches');
  container.innerHTML = '';
  THEMES.forEach(t => {
    const swatch = document.createElement('button');
    swatch.className = `profile-color-swatch ${profile.theme === t.id ? 'active' : ''}`;
    swatch.style.background = `linear-gradient(135deg, ${t.bg[0]}, ${t.bg[2]})`;
    swatch.title = t.name;
    swatch.addEventListener('click', () => {
      document.querySelectorAll('.profile-color-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      applyTheme(t.id);
    });
    container.appendChild(swatch);
  });
}

function updateProfileUI() {
  document.getElementById('profileNameInput').value = profile.name;
  renderThemeSwatches();
  document.getElementById('statGames').textContent = playerStats.totalGames;
  document.getElementById('statHits').textContent = playerStats.totalHits;
  document.getElementById('statGolden').textContent = playerStats.totalGolden;
  document.getElementById('statLifetime').textContent = playerStats.lifetimeScore.toLocaleString();
  document.getElementById('statBestCombo').textContent = `x${playerStats.bestCombo}`;
}

function openProfileDrawer() {
  updateProfileUI();
  document.getElementById('profileDrawerOverlay').classList.remove('hidden');
}
function closeProfileDrawer(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('profileDrawerOverlay').classList.add('hidden');
}
function openTrophiesModal() {
  renderAchievements();
  document.getElementById('trophiesModal').classList.remove('hidden');
}

function playAchievementSound() {
  playTone(1200, 0.08, 'sine', 0.1);
  setTimeout(() => playTone(1600, 0.12, 'sine', 0.12), 100);
  setTimeout(() => playTone(2000, 0.15, 'sine', 0.12), 200);
}

createBubbles();
applyTheme(profile.theme);
init();
</script>
</body>
</html>
